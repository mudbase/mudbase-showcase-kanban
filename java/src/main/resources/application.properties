spring.application.name=mudbase-showcase-kanban-java
server.port=${PORT:8080}

# --- Mudbase project wiring ---------------------------------------------------
mudbase.base-url=${MUDBASE_URL:https://cloud.mudbase.dev}
mudbase.project-id=${MUDBASE_PROJECT_ID:}
mudbase.lists-collection-id=${MUDBASE_LISTS_COLLECTION_ID:}
mudbase.cards-collection-id=${MUDBASE_CARDS_COLLECTION_ID:}
mudbase.activity-collection-id=${MUDBASE_ACTIVITY_COLLECTION_ID:}
# Single shared board id - not a secret, see MudbaseProperties javadoc and plan/build-plan.md.
mudbase.board-id=${MUDBASE_BOARD_ID:6a6d4072d07caabbbdfc5d3c}

# --- Thymeleaf ------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Sessions ---------------------------------------------------------------
server.servlet.session.timeout=30m

logging.level.dev.mudbase.showcase.kanban=INFO
